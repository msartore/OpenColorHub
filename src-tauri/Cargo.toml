[package]
name = "opencolorhub"
description = "Tauri desktop shell for opencolorhub — fan and ARGB control for Colorful motherboards"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "opencolorhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `main.rs` is a two-line launcher with no tests of its own, but cargo still
# builds a test harness from it — and that harness cannot be executed, because
# the binary carries the requireAdministrator manifest (spawn fails with
# ERROR_ELEVATION_REQUIRED, reported as "never executed"). Every unit test lives
# in the lib, so the harness is pure overhead.
[[bin]]
name = "opencolorhub"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
colorctl-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
