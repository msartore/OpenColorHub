<!doctype html>
<html lang="en" data-theme="carbon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>opencolorhub — fan &amp; lighting control</title>
    <style>
      /* Inline so the shell paints before the bundle and its stylesheet load. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0f13;
        color: #9fb0bd;
        font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        z-index: 9999;
        transition: opacity 160ms ease;
      }
      .boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #e7eef4;
      }
      .boot-note {
        margin: 0;
        font-size: 12px;
        color: #6f8090;
      }
      .boot-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid #1a2128;
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: boot-spin 720ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-title">OpenColorHub</p>
      <p class="boot-note">Starting — probing your hardware…</p>
    </div>
    <div id="app" class="app" aria-live="polite"></div>
    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
