name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux windowing dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Core + CLI tests
        run: cargo test --workspace

      - name: Frontend deps
        run: npm ci

      - name: Frontend build (tsc + vite)
        run: npm run build

  # The release job only runs on a tag, so the CLI packaging is exercised here
  # on every push: a broken asset path or maintainer-script reference should
  # fail the PR, not the release.
  cli-package:
    name: cli deb (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli

      - name: Build CLI
        run: cargo build --release -p opencolorhub-cli

      - name: Shell completions
        run: |
          mkdir -p completions
          ./target/release/colorctl completions bash > completions/colorctl.bash
          ./target/release/colorctl completions zsh > completions/_colorctl
          ./target/release/colorctl completions fish > completions/colorctl.fish

      - uses: taiki-e/install-action@cargo-deb

      - name: Debian package
        run: cargo deb -p opencolorhub-cli --no-build

      - name: Validate package contents
        run: |
          deb=$(ls target/debian/opencolorhub-cli_*_amd64.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | awk '{print $6}' | sort > contents.txt
          for path in ./usr/bin/colorctl \
                      ./usr/lib/udev/rules.d/99-colorctl.rules \
                      ./usr/lib/tmpfiles.d/colorctl.conf; do
            grep -qxF "$path" contents.txt || {
              echo "::error::$path is missing from $(basename "$deb")"
              exit 1
            }
          done
          echo "package contents verified"

  desktop:
    name: desktop build (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: windows-latest
            args: "--bundles nsis,msi"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux windowing dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev

      - run: npm ci

      - name: Build bundles
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencolorhub-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: warn
