name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Core + CLI tests
        run: cargo test --workspace

  # The NSH app is checked separately: it needs the `nsh` toolchain and runs
  # the TSX screens headless. Tauri is gone; there is no npm build any more.
  nsh:
    name: nsh (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "nsh -> target"

      - name: Install NSH
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.5.0'
          irm https://nsh.dev/install.ps1 | iex

      - name: Put nsh and cargo on PATH
        run: |
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check
        run: nsh check nsh

      - name: Build
        run: nsh build nsh

      - name: Tests (simulator, no hardware)
        run: |
          $env:OPENCOLORHUB_SIM = "1"
          $env:OPENCOLORHUB_DATA_DIR = Join-Path $env:RUNNER_TEMP "opencolorhub-nsh-tests"
          $env:OPENCOLORHUB_DRIVERS_FIXTURE = Join-Path $env:GITHUB_WORKSPACE "nsh/test-fixtures/drivers.json"
          Remove-Item -Recurse -Force $env:OPENCOLORHUB_DATA_DIR -ErrorAction SilentlyContinue
          nsh test nsh

  cli-package:
    name: cli deb (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli

      - name: Build CLI
        run: cargo build --release -p opencolorhub-cli

      - name: Shell completions
        run: |
          mkdir -p completions
          ./target/release/colorctl completions bash > completions/colorctl.bash
          ./target/release/colorctl completions zsh > completions/_colorctl
          ./target/release/colorctl completions fish > completions/colorctl.fish

      - uses: taiki-e/install-action@cargo-deb

      - name: Debian package
        run: cargo deb -p opencolorhub-cli --no-build

      - name: Validate package contents
        run: |
          deb=$(ls target/debian/opencolorhub-cli_*_amd64.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | awk '{print $6}' | sort > contents.txt
          for path in ./usr/bin/colorctl \
                      ./usr/lib/udev/rules.d/99-colorctl.rules \
                      ./usr/lib/tmpfiles.d/colorctl.conf; do
            grep -qxF "$path" contents.txt || {
              echo "::error::$path is missing from $(basename "$deb")"
              exit 1
            }
          done
          echo "package contents verified"
