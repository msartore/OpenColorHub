name: Release

# Tag-driven: pushing v0.2.0 builds both platforms and publishes one release.
# Nothing is published unless every platform succeeds — the release job needs
# the whole build matrix, so a Linux failure cannot leave a Windows-only release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag is a version
    runs-on: ubuntu-latest
    steps:
      # The tag is the source of truth: the build job writes it into every
      # manifest, so nothing has to be kept in sync by hand. What remains is
      # checking the tag looks like a version at all.
      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "releasing $tag"

  build:
    name: build (${{ matrix.label }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis,msi
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      # The tag carries the version; these four manifests follow it. Without
      # this, a release can be tagged v0.3.0 while the binary still reports
      # 0.2.0, and the self-updater then offers that release on every launch.
      - name: Set version from tag
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - run: npm ci

      - name: Tests
        run: cargo test --workspace

      # --bundles is passed explicitly because bundle.targets is "all" and the
      # per-platform set is what we actually want to ship.
      #
      # RUSTFLAGS remaps the runner checkout so panic locations in the shipped
      # binary read `./src/...` instead of an absolute build path.
      - name: Build bundles
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ runner.temp }}=~
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Portable package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/portable.ps1 -Version "${{ steps.ver.outputs.value }}"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe pkg/
          Copy-Item target/release/bundle/msi/*.msi pkg/
          Copy-Item target/release/bundle/portable/*.zip pkg/
          # The self-updater downloads this bare executable and swaps it in, so
          # it must be a flat release asset under exactly this name.
          Copy-Item target/release/opencolorhub.exe pkg/OpenColorHub.exe

      - name: Portable package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${{ steps.ver.outputs.value }}"
          name="opencolorhub-$version-linux-x64"
          mkdir -p "pkg/$name"
          cp target/release/opencolorhub "pkg/$name/"
          cp LICENSE.md NOTICE.md "pkg/$name/"
          {
            echo "opencolorhub $version - portable build"
            echo
            echo "Run ./opencolorhub from this directory. Fan control needs root or CAP_SYS_RAWIO"
            echo "for /dev/port; lighting uses /dev/hidraw and needs access to the device node."
            echo "Licensed GPL-3.0-only - see LICENSE.md and NOTICE.md."
          } > "pkg/$name/README.txt"
          tar -C pkg -czf "pkg/$name.tar.gz" "$name"
          rm -rf "pkg/$name"
          cp target/release/bundle/deb/*.deb pkg/
          cp target/release/bundle/appimage/*.AppImage pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          # Everything the release needs is staged flat in pkg/ first — globbing
          # target/ would preserve a nested tree and make the SHA256SUMS paths
          # wrong. `pkg` rather than `dist`: dist/ is Vite's output directory, and
          # staging there pulled the frontend's dist/assets/ into the artifact,
          # which then broke `sha256sum -- *` with "Is a directory".
          path: pkg/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Checksums
        run: |
          cd pkg
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: OpenColorHub ${{ github.ref_name }}
          # Without this the step publishes an empty release; the checksum file
          # is included so the updater can verify what it downloads.
          files: |
            pkg/*.exe
            pkg/*.msi
            pkg/*.zip
            pkg/*.tar.gz
            pkg/*.deb
            pkg/*.AppImage
            pkg/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Native builds of OpenColorHub `${{ github.ref_name }}`.

            ### Windows

            | File | Use |
            | --- | --- |
            | `OpenColorHub_*_x64-setup.exe` | installer |
            | `OpenColorHub_*_x64_en-US.msi` | `msiexec /i` for managed deployment |
            | `OpenColorHub-*-portable-win64.zip` | unzip anywhere, run `OpenColorHub.exe` |
            | `OpenColorHub.exe` | bare executable — this is what the built-in updater downloads |

            The portable build keeps settings and state in `config/` and `data/` beside the
            executable — nothing is written to `%APPDATA%` and no registry keys are created.

            Fan control on Windows runs through **PawnIO**, a signed driver that is *not*
            bundled — install it separately (the LibreHardwareMonitor installer ships it).
            Without it the app falls back to read-only HWiNFO64 telemetry (needs **Shared
            Memory Support** enabled), then to the simulator. Lighting needs no driver and
            no elevation: it talks to the controller over USB HID.

            ### Linux

            | File | Use |
            | --- | --- |
            | `opencolorhub_*_amd64.deb` | `sudo apt install ./opencolorhub_*_amd64.deb` |
            | `opencolorhub_*.AppImage` | `chmod +x` then run |
            | `opencolorhub-*-linux-x64.tar.gz` | portable, unpack and run |

            Fan control reads `/dev/port` and needs root or `CAP_SYS_RAWIO`. Lighting needs
            access to the controller's `/dev/hidraw` node.

            ### Verifying

            `SHA256SUMS.txt` covers every artifact. These builds are unsigned: expect an
            unknown-publisher warning on Windows, and check the checksum against this page.

            ### Licence

            GPL-3.0-only. Corresponding source for this build is the
            [`${{ github.ref_name }}` tag](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})
            of this repository, which is the written offer required by GPLv3 §6.
