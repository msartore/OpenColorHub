name: Release

# Tag-driven: pushing v0.3.0 builds the Native Shell app on Windows and Linux,
# the CLI, and one update manifest. Nothing is published unless every job
# succeeds — the release job needs the whole matrix, so a Linux failure cannot
# leave a Windows-only release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag is a version
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "releasing $tag"

  nsh:
    name: nsh (${{ matrix.label }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: nsh-windows-x64
            target: windows
          - os: ubuntu-24.04
            label: nsh-linux-x64
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "nsh -> target"
          key: ${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install NSH (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Package
        run: nsh package nsh --target ${{ matrix.target }}

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item .nsh/out/*.zip pkg/
          Copy-Item .nsh/out/*-setup.exe pkg/

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp .nsh/out/*.tar.gz pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: pkg/*
          if-no-files-found: error
          retention-days: 7

  # One manifest for both NSH archives; `nsh/updater` reads it from the release.
  nsh-manifest:
    name: nsh update manifest
    needs: nsh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Set version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Write latest.json
        run: |
          cd pkg
          nsh update-manifest *-windows-x86_64.zip *-linux-x86_64.tar.gz \
            --entry ../nsh \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            -o .
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: nsh-manifest
          path: pkg/latest.json
          if-no-files-found: error
          retention-days: 7

  cli:
    name: cli + deb (linux-x64)
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Build CLI
        run: cargo build --release -p opencolorhub-cli

      - name: Shell completions
        run: |
          mkdir -p completions
          ./target/release/colorctl completions bash > completions/colorctl.bash
          ./target/release/colorctl completions zsh > completions/_colorctl
          ./target/release/colorctl completions fish > completions/colorctl.fish

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Debian package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo deb -p opencolorhub-cli --no-build
          mkdir -p pkg
          cp target/debian/opencolorhub-cli_*_amd64.deb "pkg/opencolorhub-cli_${version}_amd64.deb"

      - name: Portable package (Linux)
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="opencolorhub-cli-$version-linux-x64"
          mkdir -p "pkg/$name"
          cp target/release/colorctl "pkg/$name/"
          cp -r completions "pkg/$name/"
          cp LICENSE.md NOTICE.md "pkg/$name/"
          cp packaging/colorctl.rules "pkg/$name/"
          cat > "pkg/$name/README.txt" <<EOF
          colorctl $version - command line build

          Put colorctl on your PATH. Shell completions are in completions/.
          Lighting needs access to the controller's /dev/hidraw node: the .deb
          installs the udev rule, here install it yourself if the device is refused:
            sudo cp colorctl.rules /etc/udev/rules.d/99-colorctl.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --subsystem-match=hidraw
          Fan control needs root or CAP_SYS_RAWIO for /dev/port.
          Licensed GPL-3.0-only - see LICENSE.md and NOTICE.md.
          EOF
          tar -C pkg -czf "pkg/$name.tar.gz" "$name"
          tar -czf "pkg/opencolorhub-cli-$version-completions.tar.gz" completions
          rm -rf "pkg/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: pkg/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [cli, nsh-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Set version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Write latest.json
        run: |
          cd pkg
          nsh update-manifest *-windows-x86_64.zip *-linux-x86_64.tar.gz \
            --entry ../nsh \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            -o .

      - name: Checksums
        run: |
          cd pkg
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: OpenColorHub ${{ github.ref_name }}
          files: |
            pkg/*.exe
            pkg/*.zip
            pkg/*.tar.gz
            pkg/*.deb
            pkg/latest.json
            pkg/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Native builds of OpenColorHub `${{ github.ref_name }}`.

            ### Desktop app

            | File | Use |
            | --- | --- |
            | `OpenColorHub-setup.exe` | Windows installer, per-user — no administrator prompt to install |
            | `OpenColorHub-*-windows-x86_64.zip` | unzip anywhere and run `OpenColorHub.exe` |
            | `OpenColorHub-*-linux-x86_64.tar.gz` | unpack and run `OpenColorHub` |
            | `latest.json` | update manifest for the app's built-in updater |

            This release is built with **Native Shell**: native windows, no WebView
            runtime, no Tauri. The installer is deliberately per-user; when PawnIO
            is present the app asks before restarting elevated, so fan control can
            open the driver. Lighting and telemetry work without elevation.

            **Existing Tauri installs do not update into this app.** Install this
            release by hand once; the old updater only replaces its own shell.

            ### `colorctl` CLI

            | File | Use |
            | --- | --- |
            | `opencolorhub-cli_*_amd64.deb` | `sudo apt install …` — the CLI, completions and the udev rule |
            | `opencolorhub-cli-*-linux-x64.tar.gz` | portable `colorctl` + completions |
            | `opencolorhub-cli-*-completions.tar.gz` | bash/zsh/fish completions only |

            The `.deb` installs the udev rule that grants the logged-in user access
            to the controller's `/dev/hidraw` node. Fan control reads `/dev/port`
            and needs root or `CAP_SYS_RAWIO`.

            ### Verifying

            `SHA256SUMS.txt` covers every artifact. These builds are unsigned:
            expect an unknown-publisher warning on Windows, and check the checksum
            against this page.

            ### Licence

            GPL-3.0-only. Corresponding source for this build is the
            [`${{ github.ref_name }}` tag](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})
            of this repository, which is the written offer required by GPLv3 §6.
